name: KU9 Rebuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout KU9 project
        uses: actions/checkout@v4


      - name: Show repository
        run: |
          echo "===== Repository ====="
          find . -maxdepth 3 -type f | sort | head -200 || true


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            wget \
            unzip \
            git \
            openjdk-17-jdk


      - name: Download Apktool
        run: |
          mkdir -p tools

          wget \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
            -O tools/apktool.jar


      - name: Check KU9 APK
        run: |
          if [ ! -f "input/ku9.apk" ]; then
            echo "ERROR: input/ku9.apk not found"
            exit 1
          fi

          ls -lh input/ku9.apk


      - name: Clone 080java
        run: |
          rm -rf base080java

          git clone \
            https://github.com/9602894/080java.git \
            base080java

          echo "===== 080java ====="

          find base080java -maxdepth 4 -type f | sort | head -300 || true


      - name: Decode KU9
        run: |
          rm -rf ku9_decode

          java -jar tools/apktool.jar \
            d input/ku9.apk \
            -o ku9_decode \
            --force


      - name: Analyze Android project
        run: |
          echo "===== Gradle ====="
          find base080java \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            | sort

          echo ""
          echo "===== Android resources ====="

          find base080java \
            -type d \
            -path "*/src/main/res" \
            -print


      - name: Prepare KU9 patch
        run: |
          mkdir -p ku9_patch

          cp -r ku9_decode/res \
            ku9_patch/res

          if [ -d "ku9_decode/assets" ]; then
            cp -r ku9_decode/assets \
              ku9_patch/assets
          fi

          cp ku9_decode/AndroidManifest.xml \
            ku9_patch/AndroidManifest.xml

          echo "===== KU9 patch ====="
          find ku9_patch -maxdepth 2 -type d | sort


      - name: Find Android module
        run: |
          RES_DIR=$(find base080java \
            -type d \
            -path "*/src/main/res" \
            -print -quit)

          if [ -z "$RES_DIR" ]; then
            echo "ERROR: Cannot find Android resource directory in 080java"
            echo ""
            echo "Repository structure:"
            find base080java -maxdepth 5 -type d | sort | head -300 || true
            exit 1
          fi

          echo "RES_DIR=$RES_DIR" >> "$GITHUB_ENV"

          MAIN_DIR=$(dirname "$RES_DIR")

          echo "MAIN_DIR=$MAIN_DIR" >> "$GITHUB_ENV"

          echo "Android resource directory:"
          echo "$RES_DIR"


      - name: Merge KU9 resources
        run: |
          echo "Using:"
          echo "$RES_DIR"

          mkdir -p "$RES_DIR"

          cp -rf ku9_patch/res/* \
            "$RES_DIR/" || true

          if [ -d "ku9_patch/assets" ]; then

            mkdir -p "$MAIN_DIR/assets"

            cp -rf ku9_patch/assets/* \
              "$MAIN_DIR/assets/" || true

          fi


      - name: Locate Gradle wrapper
        run: |
          GRADLEW=$(find base080java \
            -name gradlew \
            -type f \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

          echo "Gradle wrapper:"
          echo "$GRADLEW"


      - name: Build 080java with KU9 resources
        run: |
          cd "$(dirname "$GRADLEW")"

          ./gradlew assembleRelease --stacktrace


      - name: Find APK
        run: |
          echo "===== APK ====="

          find base080java \
            -type f \
            -name "*.apk" \
            -print


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: KU9-rebuild
          path: |
            base080java/**/*.apk
