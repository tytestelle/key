name: Clean KU9 Source


on:
  workflow_dispatch:


jobs:

  clean:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install tools

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk \
          python3



    - name: Install apktool

      run: |

        mkdir -p tools


        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    - name: Decode KU9 APK

      run: |

        java -jar tools/apktool.jar \
        d input/ku9.apk \
        -o ku9_decode \
        --force



    - name: Analyze 080java

      run: |

        echo "===== 080java ====="

        find . \
        -type f \
        | grep -E "\.java$|\.xml$|\.gradle$" \
        | head -200



    - name: Remove useless libraries

      run: |

        mkdir clean_source


        # Java源码

        find . \
        -name "*.java" \
        -not -path "./ku9_decode/*" \
        -exec cp --parents {} clean_source/ \;



    - name: Extract KU9 resources

      run: |

        mkdir -p clean_source/ku9_patch


        cp -r ku9_decode/res \
        clean_source/ku9_patch/


        if [ -d ku9_decode/assets ]; then

          cp -r ku9_decode/assets \
          clean_source/ku9_patch/

        fi



    - name: Remove obvious obfuscation

      run: |

        python3 <<EOF

import os,re


root="clean_source"


for path,dirs,files in os.walk(root):

    for f in files:

        if f.endswith(".java"):

            p=os.path.join(path,f)

            try:

                s=open(p,encoding="utf-8").read()

            except:

                continue


            # 删除 JADX 自动生成注释

            s=re.sub(
                r'/\* JADX.*?\*/',
                '',
                s,
                flags=re.S
            )


            open(
                p,
                "w",
                encoding="utf-8"
            ).write(s)

EOF



    - name: Package

      run: |

        zip -r KU9-clean-source.zip clean_source



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name: KU9-clean-source

        path: KU9-clean-source.zip
