name: Build KU9 TVBox


on:

  workflow_dispatch:



jobs:


  build:


    runs-on: ubuntu-latest



    steps:


    # =========================
    # 拉取源码
    # =========================

    - name: Checkout source

      uses: actions/checkout@v4



    # =========================
    # 显示工程结构
    # =========================

    - name: Show project tree

      run: |

        echo "===== Project ====="

        find . -maxdepth 4 -type d | sort | head -150



    # =========================
    # 安装环境
    # =========================

    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    # =========================
    # 安装 apktool
    # =========================

    - name: Install apktool

      run: |

        mkdir -p tools


        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    # =========================
    # 检查 KU9 APK
    # =========================

    - name: Check KU9 APK

      run: |

        ls -lh input/




    # =========================
    # 合并 KU9资源
    # =========================

    - name: Apply KU9 patch

      run: |

        chmod +x scripts/apply_ku9.sh

        ./scripts/apply_ku9.sh



    # =========================
    # 查找 gradle
    # =========================

    - name: Find gradle project

      run: |

        find . -name gradlew -type f




    # =========================
    # 编译
    # =========================

    - name: Build APK

      run: |

        chmod +x ./gradlew

        ./gradlew assembleRelease --stacktrace



    # =========================
    # 查找生成APK
    # =========================

    - name: Find APK

      run: |

        find . -name "*.apk"



    # =========================
    # 上传
    # =========================

    - name: Upload APK

      uses: actions/upload-artifact@v4


      with:

        name: KU9-release-apk

        path: |

          **/build/outputs/apk/**/*.apk
