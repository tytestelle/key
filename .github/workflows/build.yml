name: Build KU9 TVBox


on:

  workflow_dispatch:



jobs:


  build:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install tools

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          openjdk-17-jdk



    - name: Install apktool

      run: |

        mkdir -p tools


        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    - name: Apply KU9 resources

      run: |

        chmod +x scripts/apply_ku9.sh

        ./scripts/apply_ku9.sh



    - name: Build APK

      run: |

        chmod +x gradlew

        ./gradlew assembleRelease



    - name: Upload APK

      uses: actions/upload-artifact@v4


      with:

        name: KU9-build

        path: |

          app/build/outputs/apk/release/*.apk
