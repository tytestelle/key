name: KU9 Decompile CFR


on:

  workflow_dispatch:



permissions:

  contents: read



jobs:


  decompile:


    name: Decompile KU9 APK


    runs-on: ubuntu-latest



    steps:



    - name: Checkout

      uses: actions/checkout@v4



    - name: Install Java and tools

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    - name: Create tools folder

      run: |

        mkdir -p tools



    - name: Download apktool

      run: |

        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    - name: Download baksmali

      run: |

        wget \
        https://repo1.maven.org/maven2/com/android/tools/smali/baksmali/3.0.9/baksmali-3.0.9.jar \
        -O tools/baksmali.jar



    - name: Download smali

      run: |

        wget \
        https://repo1.maven.org/maven2/com/android/tools/smali/smali/3.0.9/smali-3.0.9.jar \
        -O tools/smali.jar



    - name: Download dex2jar

      run: |

        wget \
        https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-2.4.zip \
        -O dex-tools.zip


        unzip -o dex-tools.zip


        mv dex-tools-* tools/dex-tools



    - name: Download CFR

      run: |

        wget \
        https://www.benf.org/other/cfr/cfr-0.152.jar \
        -O tools/cfr.jar



    - name: Check APK

      run: |

        echo "APK:"

        ls -lh input/



    - name: Decode resources

      run: |

        rm -rf output

        mkdir output


        java -jar tools/apktool.jar \
        d input/ku9.apk \
        -o output/apktool \
        --force



    - name: Extract dex

      run: |

        mkdir -p output/dex


        unzip -o \
        input/ku9.apk \
        "classes*.dex" \
        -d output/dex



    - name: Baksmali decode

      run: |

        mkdir -p output/smali


        for dex in output/dex/*.dex

        do

          name=$(basename "$dex" .dex)


          echo "Decode $name"


          java -jar tools/baksmali.jar \
          d "$dex" \
          -o output/smali/$name


        done



    - name: Dex to jar

      run: |

        mkdir -p output/jar


        for dex in output/dex/*.dex

        do

          name=$(basename "$dex" .dex)


          echo "Convert $name"


          sh tools/dex-tools/d2j-dex2jar.sh \
          "$dex" \
          -o output/jar/$name.jar \
          --force


        done



    - name: CFR Java decompile

      run: |

        mkdir -p output/java


        for jar in output/jar/*.jar

        do

          name=$(basename "$jar" .jar)


          mkdir -p output/java/$name


          echo "Decompile $name"


          java -jar tools/cfr.jar \
          "$jar" \
          --outputdir output/java/$name \
          --silent true


        done



    - name: Copy resources

      run: |

        cp -r output/apktool/res output/ || true


        cp -r output/apktool/assets output/ || true


        cp output/apktool/AndroidManifest.xml output/ || true



    - name: Package result

      run: |

        zip -r KU9-source-CFR.zip output



    - name: Upload result

      uses: actions/upload-artifact@v4

      with:

        name: KU9-source-CFR

        path: KU9-source-CFR.zip
