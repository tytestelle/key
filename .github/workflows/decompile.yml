name: KU9 APK Decompile


on:

  workflow_dispatch:


jobs:

  decompile:

    runs-on: ubuntu-latest


    steps:

    # ======================
    # Checkout
    # ======================

    - name: Checkout source
      uses: actions/checkout@v4



    # ======================
    # Install dependencies
    # ======================

    - name: Install packages
      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    # ======================
    # Download apktool
    # ======================

    - name: Download apktool
      run: |

        mkdir -p tools

        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    # ======================
    # Download jadx
    # ======================

    - name: Download jadx
      run: |

        wget \
        https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip \
        -O jadx.zip


        unzip jadx.zip -d tools


        mv tools/jadx-1.5.1 tools/jadx


        chmod +x tools/jadx/bin/jadx



    # ======================
    # Run script
    # ======================

    - name: Decompile KU9
      run: |

        chmod +x scripts/decompile.sh

        ./scripts/decompile.sh



    # ======================
    # Package result
    # ======================

    - name: Compress result
      run: |

        zip -r KU9-source.zip output



    # ======================
    # Upload
    # ======================

    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: KU9-source

        path: KU9-source.zip
