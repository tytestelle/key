name: KU9 APK Decompile


on:

  workflow_dispatch:



jobs:

  decompile:

    runs-on: ubuntu-latest


    steps:


    # =====================
    # 拉代码
    # =====================

    - name: Checkout
      uses: actions/checkout@v4



    # =====================
    # 环境
    # =====================

    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    # =====================
    # apktool
    # =====================

    - name: Install apktool
      run: |

        mkdir -p tools


        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    # =====================
    # jadx
    # =====================

    - name: Install jadx
      run: |

        wget \
        https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip \
        -O jadx.zip


        unzip -o jadx.zip -d tools


        chmod +x tools/bin/jadx



    # =====================
    # 执行
    # =====================

    - name: Decompile KU9
      run: |

        chmod +x scripts/decompile.sh

        ./scripts/decompile.sh



    # =====================
    # 打包
    # =====================

    - name: Compress result
      run: |

        zip -r KU9-source.zip output



    # =====================
    # 下载
    # =====================

    - name: Upload artifact
      uses: actions/upload-artifact@v4

      with:

        name: KU9-source

        path: KU9-source.zip
