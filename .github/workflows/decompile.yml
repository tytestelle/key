name: KU9 Decompile


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  decompile:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install environment

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          git \
          openjdk-17-jdk



    - name: Prepare tools

      run: |

        mkdir -p tools



    - name: Download apktool

      run: |

        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    - name: Build dex2jar

      run: |

        git clone https://github.com/pxb1988/dex2jar.git


        cd dex2jar


        ./gradlew distZip


        unzip -o dex-tools/build/distributions/*.zip -d ../tools



        cd ..



        mv tools/dex-tools-* tools/dex-tools



    - name: Download CFR

      run: |

        wget \
        https://www.benf.org/other/cfr/cfr-0.152.jar \
        -O tools/cfr.jar



    - name: Check

      run: |

        ls -R tools

        ls -lh input



    - name: Run

      run: |

        chmod +x scripts/decompile.sh

        ./scripts/decompile.sh



    - name: Package

      run: |

        zip -r KU9-source.zip output



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name: KU9-source

        path: KU9-source.zip
