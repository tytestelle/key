name: KU9 APK Decompile


on:
  workflow_dispatch:


jobs:

  decompile:

    runs-on: ubuntu-latest


    steps:

    # -----------------------
    # 拉取代码
    # -----------------------

    - name: Checkout source
      uses: actions/checkout@v4



    # -----------------------
    # 安装环境
    # -----------------------

    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    # -----------------------
    # 安装 apktool
    # -----------------------

    - name: Download apktool
      run: |

        mkdir -p tools

        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    # -----------------------
    # 安装 jadx
    # -----------------------

    - name: Download jadx
      run: |

        wget \
        https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip \
        -O jadx.zip


        unzip -o jadx.zip -d tools


        chmod +x tools/bin/jadx



    # -----------------------
    # 执行反编译
    # -----------------------

    - name: Decompile KU9 APK
      run: |

        chmod +x scripts/decompile.sh

        ./scripts/decompile.sh



    # -----------------------
    # 压缩结果
    # -----------------------

    - name: Package result
      run: |

        zip -r KU9-source.zip output



    # -----------------------
    # 上传结果
    # -----------------------

    - name: Upload result
      uses: actions/upload-artifact@v4

      with:

        name: KU9-source

        path: KU9-source.zip
