name: KU9 Decompile


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  decompile:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install Java

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    - name: Prepare tools

      run: |

        mkdir -p tools



    - name: Download apktool

      run: |

        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    - name: Download baksmali

      run: |

        wget \
        https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar \
        -O tools/baksmali.jar



    - name: Download smali

      run: |

        wget \
        https://github.com/JesusFreke/smali/releases/download/v2.5.2/smali-2.5.2.jar \
        -O tools/smali.jar



    - name: Download dex2jar

      run: |

        wget \
        https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-2.4.zip \
        -O dex-tools.zip


        unzip -o dex-tools.zip


        mv dex-tools-* tools/dex-tools



    - name: Download CFR

      run: |

        wget \
        https://www.benf.org/other/cfr/cfr-0.152.jar \
        -O tools/cfr.jar



    - name: Check files

      run: |

        echo "APK:"

        ls -lh input/

        echo ""

        echo "Tools:"

        ls -lh tools/



    - name: Run decompile

      run: |

        chmod +x scripts/decompile.sh

        ./scripts/decompile.sh



    - name: Compress result

      run: |

        zip -r KU9-source.zip output



    - name: Upload result

      uses: actions/upload-artifact@v4

      with:

        name: KU9-source

        path: KU9-source.zip
