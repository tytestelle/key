name: KU9 Decompile


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  decompile:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install Java

      run: |

        sudo apt update

        sudo apt install -y \
          wget \
          unzip \
          openjdk-17-jdk



    - name: Prepare tools

      run: |

        mkdir -p tools



    - name: Download apktool

      run: |

        wget \
        https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar \
        -O tools/apktool.jar



    - name: Download smali

      run: |

        wget \
        https://repo1.maven.org/maven2/org/smali/smali/3.0.9/smali-3.0.9.jar \
        -O tools/smali.jar


        wget \
        https://repo1.maven.org/maven2/org/smali/baksmali/3.0.9/baksmali-3.0.9.jar \
        -O tools/baksmali.jar



    - name: Download dex2jar

      run: |

        wget \
        https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-2.4.zip \
        -O dex-tools.zip


        unzip -o dex-tools.zip


        mv dex-tools-* tools/dex-tools



    - name: Download CFR

      run: |

        wget \
        https://www.benf.org/other/cfr/cfr-0.152.jar \
        -O tools/cfr.jar



    - name: Check

      run: |

        ls -lh tools/

        ls -lh input/



    - name: Run

      run: |

        chmod +x scripts/decompile.sh

        ./scripts/decompile.sh



    - name: Zip

      run: |

        zip -r KU9-source.zip output



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name: KU9-source

        path: KU9-source.zip
